
name: AI381 CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint
        run: ruff check src tests

      - name: Run tests
        run: python -m pytest tests -v

  build_scan_push:
    name: Build, Scan and Push
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build --pull -t "$IMAGE_NAME:$GITHUB_SHA" .

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0 \
            image --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$IMAGE_NAME:$GITHUB_SHA"

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Push image to GHCR
        run: |
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          IMAGE_DIGEST=$(docker image inspect "$IMAGE_NAME:$GITHUB_SHA" --format='{{index .RepoDigests 0}}')
          echo "### Docker image published" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$IMAGE_NAME:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

